services:
  vllm:
    image: vllm/vllm-openai:v0.21.0
    container_name: vllm_small_brain
    runtime: nvidia
    ipc: host
    shm_size: "8g"
    ports:
      - "8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - VLLM_API_KEY=${VLLM_SMALL_BRAIN_API_KEY}
    command: >
      --api-key ${VLLM_SMALL_BRAIN_API_KEY}
      --model Vishva007/gemma-4-E4B-it-W4A16-AutoRound-GPTQ
      --served-model-name gemma-4-E4B-it
      --dtype bfloat16
      --tensor-parallel-size 1
      --max-model-len 32768
      --gpu-memory-utilization 0.95
      --max-num-seqs 16
      --max-num-batched-tokens 32768
      --enable-chunked-prefill
      --enable-prefix-caching
      --kv-cache-dtype auto
      --generation-config auto
      --tool-call-parser gemma4
      --enable-auto-tool-choice
      --reasoning-parser gemma4
      --limit-mm-per-prompt '{"image": 0, "video": 0, "audio": 0}'
      --trust-remote-code
      --host 0.0.0.0
      --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always
